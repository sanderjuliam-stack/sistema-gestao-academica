<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente da Paleta: Sidebar (#172554) e Primary (#1e3a8a) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Borda de realce sutil (#1d4ed8) -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#1d4ed8" stroke-width="12" opacity="0.5" />

  <!-- Capelo Acadêmico -->
  <g transform="translate(0, 10)">
    <!-- Base do Capelo (#eff6ff) -->
    <path d="M140,240 V300 C140,345 192,375 256,375 C320,375 372,345 372,300 V240 C340,260 300,272 256,272 C212,272 172,260 140,240 Z" fill="#eff6ff" />
    
    <!-- Topo do Capelo (#ffffff) -->
    <polygon points="256,115 436,200 256,285 76,200" fill="#ffffff" />
    
    <!-- Sombra interna do topo -->
    <polygon points="256,285 436,200 256,220 76,200" fill="#eff6ff" opacity="0.6" />
    
    <!-- Cordão e Ponto Central (#1d4ed8 / #eff6ff) -->
    <circle cx="256" cy="200" r="14" fill="#1d4ed8" />
    <path d="M110,215 L110,310" stroke="#eff6ff" stroke-width="14" stroke-linecap="round" />
    <circle cx="110" cy="325" r="18" fill="#1d4ed8" />
  </g>
</svg>
